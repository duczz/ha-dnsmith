# Base images come from Home Assistant, so the add-on inherits its s6-overlay,
# its bashio helpers and its security patches rather than carrying its own.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.24
  amd64: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.24

labels:
  org.opencontainers.image.title: DNSmith
  org.opencontainers.image.description: Der DDNS-Hub für Home Assistant
  org.opencontainers.image.source: https://github.com/duczz/ha-dnsmith
  org.opencontainers.image.licenses: MIT
