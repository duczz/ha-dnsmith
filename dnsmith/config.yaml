name: DNSmith
version: "0.1.0"
slug: dnsmith
# No full stop at the end. Home Assistant appends one itself when it renders
# the description under the installed app, so a trailing period shows up as "..".
description: >-
  Ein Hub für alle Dynamic-DNS-Anbieter. Einmal installieren, Anbieter
  auswählen, Zugangsdaten eintragen — fertig
url: https://github.com/duczz/ha-dnsmith

# The Supervisor pulls the prebuilt image from ghcr.io (built by
# .github/workflows/release-docker.yml) instead of building this folder on
# the device - Home Assistant's preferred way: faster, and nothing can fail
# to build on the user's hardware. Update detection does not depend on it:
# the Supervisor offers an update whenever `version` above differs from the
# installed one. To test a local copy of this folder, comment the key out,
# or the Supervisor pulls the published image instead of building the copy.
image: ghcr.io/duczz/ha-dnsmith/{arch}

# Home Assistant dropped 32-bit architectures, so promising armv7 or armhf
# would promise a platform the Supervisor base no longer supports.
arch:
  - aarch64
  - amd64

# The interface lives behind Ingress. No port is published: nothing outside
# Home Assistant needs to reach this add-on, and an unexposed port cannot be
# found by a scan.
ingress: true
panel_icon: mdi:dns
panel_title: DNSmith

init: false

map:
  - type: addon_config
    read_only: false

# Health check moved to the Dockerfile's HEALTHCHECK directive — the
# Supervisor's "watchdog" key is obsolete for this.

# Lets the add-on announce itself to Home Assistant so the integration can be
# set up without the user copying a host and a token by hand.
hassio_api: true
discovery:
  - dnsmith

backup_exclude:
  - "*.tmp"
