# Quelle fuer providers/gigahostno.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Gigahost
description: Norwegischer Hoster. Der DynDNS-Endpunkt ist auf E-Mail und Passwort ausgelegt.
website: https://gigahost.no
categories:
- dns_provider
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
auth:
  one_of:
  - id: basic
    label: E-Mail und Passwort
    recommended: true
    fields:
    - email
    - password
    hint: 'Die Zugangsdaten des Gigahost-Kontos. Gigahost dokumentiert für den DynDNS-Endpunkt
      ausdrücklich nur dieses Verfahren.

      '
  - id: apikey
    label: API-Schlüssel
    fields:
    - apikey
    hint: 'Beginnt mit flux_live_ und wird nur einmal vollständig angezeigt. Für die übrigen Endpunkte
      von Gigahost vorgesehen; ob der DynDNS-Endpunkt ihn annimmt, ist nicht dokumentiert. Wenn Updates
      damit an der Anmeldung scheitern, auf E-Mail und Passwort umstellen.

      '
request:
  url: https://api.gigahost.no/api/v0/dns/dyndns
  auth:
  - mode: basic
    username: '{email}'
    password: '{password}'
  - mode: bearer
    format: '{apikey}'
  params:
    hostname: '{hostname}'
    myip: '{ipv4}'
    myipv6: '{ipv6}'
  success:
    vocabulary: dyndns2
fields:
- id: apikey
  type: secret
  label: API-Schlüssel
- id: email
  type: email
  label: Konto-E-Mail
  placeholder: du@example.com
- id: password
  type: secret
  label: Konto-Passwort
