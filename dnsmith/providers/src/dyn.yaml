# Quelle fuer providers/dyn.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Dyn
description: Kommerzieller DDNS-Dienst von Oracle, früher DynDNS. Kostenpflichtig, auch für Neukunden
  buchbar.
website: https://account.dyn.com
categories:
- commercial_ddns
- dyndns2_compatible
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
auth:
  one_of:
  - id: client_key
    label: Client-Key
    recommended: true
    fields:
    - client_key
    hint: 'Der aktuelle Weg. Der Client-Key steht im Dyn-Account unter den Update-Clients. Upstream dokumentiert
      ausschließlich diesen.

      '
  - id: password
    label: Account-Passwort
    deprecated: true
    fields:
    - password
    hint: 'Der alte Weg, im Quelltext als veraltet markiert und nur noch aus Kompatibilität vorhanden.
      Bestehende Konfigurationen funktionieren weiter; für neue besser den Client-Key nehmen.

      '
request:
  url: https://members.dyndns.org/v3/update
  auth:
    mode: basic
    username: '{username}'
    password: '{client_key|password}'
  params:
    hostname: '{hostname}'
    myip: '{ip}'
  success:
    vocabulary: dyndns2
fields:
- id: username
  type: text
  label: Benutzername
  required: true
  help: Der Benutzername des Dyn-Accounts.
- id: client_key
  type: secret
  label: Client-Key
- id: password
  type: secret
  label: Account-Passwort
