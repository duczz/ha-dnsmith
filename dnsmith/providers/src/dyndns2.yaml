# Quelle fuer providers/dyndns2.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Generisches DynDNS2
description: 'Jeder Dienst, der das klassische DynDNS2-Protokoll spricht — Update-URL mit Basic-Auth und
  den Antworten good, nochg, badauth, nohost, abuse.

  '
categories:
- dyndns2_compatible
- generic
popular: true
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  wildcard: false
  multiple_records: true
  ttl: false
  proxy: false
fields:
- id: server
  type: url
  label: Update-URL
  required: true
  help: 'Die vollständige Update-Adresse des Anbieters, zum Beispiel https://dyndns.example.com/nic/update.
    Steht in dessen DynDNS-Dokumentation.

    '
  placeholder: https://dyndns.example.com/nic/update
  validate:
    pattern: ^https?://
- id: username
  type: text
  label: Benutzername
  required: true
- id: password
  type: secret
  label: Passwort oder Update-Token
  required: true
  help: 'Was dein Anbieter für den DynDNS2-Aufruf verlangt. Sehr oft ist das nicht das Konto-Passwort,
    sondern ein eigenes Update-Passwort oder ein Token — steht in der DynDNS-Anleitung des Anbieters.

    '
- id: ipv4_parameter
  type: text
  label: Parametername für IPv4
  default: myip
  help: Fast alle Anbieter verwenden "myip". Nur ändern, wenn die Dokumentation es verlangt.
- id: ipv6_parameter
  type: text
  label: Parametername für IPv6
  default: myipv6
  help: Häufig "myipv6". Manche Anbieter erwarten stattdessen beide Adressen in "myip".
- id: hostname_parameter
  type: text
  label: Parametername für den Hostnamen
  default: hostname
notes:
- 'Erst probieren, ob der Anbieter bereits als eigener Provider in der Liste steht — dort sind die Eigenheiten
  schon berücksichtigt.

  '
