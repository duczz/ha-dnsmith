# Quelle fuer providers/scaleway.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Scaleway
description: Französischer Cloud-Anbieter mit API-Schlüsseln aus dem IAM-Bereich.
website: https://www.scaleway.com
categories:
- cloud_dns
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: true
  proxy: false
request:
  url: https://api.scaleway.com/domain/v2beta1/dns-zones/{domain}/records
  method: PATCH
  auth:
    mode: header
    header: X-Auth-Token
    format: '{secret_key}'
  headers:
    Content-Type: application/json
    Accept: application/json
  body_type: json
  body:
    changes:
    - set:
        id_fields:
          name: '{owner}'
          type: '{rrtype}'
        records:
        - data: '{ip}'
          name: '{owner}'
          ttl: '{ttl}'
  success:
    status:
    - 200
fields:
- id: secret_key
  type: secret
  label: Secret Key
  required: true
  help: 'Der geheime Teil eines Scaleway-API-Keys, nicht dein Konto-Passwort. In der Console unter IAM
    → API keys erzeugen und sofort notieren.

    '
- id: ttl
  type: integer
  label: TTL
  placeholder: '300'
  help: Sekunden. Leer lassen überlässt Scaleway den Standard.
