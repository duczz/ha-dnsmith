# Quelle fuer providers/ipv64.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: IPv64
description: Deutscher DDNS-Dienst mit starkem IPv6-Fokus, eigenen Subdomains und Healthchecks.
website: https://ipv64.net
categories:
- free_ddns
- german
- ipv6_focused
popular: true
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
rate_limit:
  note: IPv64 rechnet Updates gegen ein Tageskontingent an. Kurze Intervalle verbrauchen es schnell.
  min_interval: 60s
request:
  url: https://ipv64.net/nic/update
  params:
    key: '{key}'
    domain: '{hostname}'
    ip: '{ipv4}'
    ip6: '{ipv6}'
  success:
    status:
    - 200
fields:
- id: key
  type: secret
  label: Update-Token der Domain
  required: true
  help: Der Schlüssel aus deinem IPv64-Konto. Du kannst auch die komplette Update-URL einfügen, die IPv64
    anzeigt (https://ipv64.net/nic/update?key=…) — DNSmith nimmt sich den Schlüssel selbst heraus.
  extract:
    url_query: key
notes:
- 'IPv64 kennt zusätzlich einen Account-Update-Token und einen Economy-Modus. Die eingesetzte Engine unterstützt
  beides derzeit nicht — DNSmith aktualisiert ohnehin nur bei tatsächlicher IP-Änderung, was den Economy-Modus
  praktisch ersetzt.

  '
