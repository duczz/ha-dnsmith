# Quelle fuer providers/joker.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Joker.com
description: Registrar aus Deutschland. DynDNS steht für jede dort verwaltete Domain zur Verfügung und
  spricht das klassische DynDNS2-Protokoll.
website: https://joker.com
categories:
- registrar
- german
- dyndns2_compatible
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: false
  ttl: false
  proxy: false
request:
  url: https://svc.joker.com/nic/update
  params:
    username: '{username}'
    password: '{password}'
    hostname: '{hostname}'
    myip: '{ip}'
  success:
    vocabulary: dyndns2
fields:
- id: username
  type: text
  label: DynDNS-Benutzername
  required: true
  help: 'Nicht die Anmeldedaten deines Joker.com-Kontos. Benutzername und Passwort werden im Kundenbereich
    eigens für DynDNS erzeugt und sehen aus wie eine zufällige Zeichenfolge.

    '
  extract:
    url_query: username
- id: password
  type: secret
  label: DynDNS-Passwort
  required: true
  help: Wird zusammen mit dem Benutzernamen im Kundenbereich erzeugt.
  extract:
    url_query: password
notes:
- 'DynDNS muss je Domain im Kundenbereich unter "DNS" erst eingeschaltet werden; erst dann erscheinen
  Benutzername und Passwort.

  '
