# Quelle fuer providers/allinkl.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: ALL-INKL.COM
description: Deutscher Webhoster mit eigener DDNS-Funktion, die im KAS je Benutzer eingerichtet wird.
website: https://all-inkl.com
categories:
- german
- dns_provider
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
request:
  url: https://dyndns.kasserver.com/
  auth:
    mode: basic
    username: '{username}'
    password: '{password}'
  params:
    myip: '{ipv4}'
    host: '{hostname}'
    myip6: '{ipv6}'
  success:
    vocabulary: dyndns2
fields:
- id: username
  type: text
  label: DDNS-Benutzername
  required: true
  help: 'Nicht dein KAS-Login. All-Inkl vergibt beim Anlegen eines DDNS-Benutzers automatisch einen Namen,
    der meist mit "dyn" und Ziffern beginnt. Zu finden im KAS unter Tools → DDNS-Einstellungen.

    '
- id: password
  type: secret
  label: DDNS-Passwort
  required: true
  help: 'Nicht dein KAS-Passwort. Dieses vergibst du selbst, wenn du im KAS unter Tools → DDNS-Einstellungen
    einen neuen DDNS-Benutzer anlegst.

    '
example:
  username: dynXXXXXXX
