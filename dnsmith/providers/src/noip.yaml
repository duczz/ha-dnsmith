# Quelle fuer providers/noip.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: No-IP
description: Bekannter DDNS-Dienst mit kostenlosem Tarif. Kostenlose Hostnamen müssen regelmäßig von Hand
  bestätigt werden.
website: https://www.noip.com
categories:
- free_ddns
- commercial_ddns
- dyndns2_compatible
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
rate_limit:
  note: No-IP sperrt Clients, die häufiger als alle fünf Minuten aktualisieren; der Dienst antwortet dann
    mit "abuse".
  min_interval: 5m
request:
  url: https://dynupdate.no-ip.com/nic/update
  auth:
    mode: basic
    username: '{username}'
    password: '{password}'
  params:
    hostname: '{hostname}'
    myip: '{ip}'
  success:
    vocabulary: dyndns2
fields:
- id: username
  type: text
  label: DDNS-Key-Benutzername
  required: true
  help: 'Besser nicht dein No-IP-Login: unter DNS Records → Hostname bearbeiten → "Enable Dynamic DNS"
    einen DDNS Key erzeugen. No-IP legt dabei einen eigenen Benutzernamen an. Der Kontoname funktioniert
    auch, ist aber unsicherer.

    '
- id: password
  type: secret
  label: DDNS-Key-Passwort
  required: true
  help: 'Wird beim Erzeugen des Keys nur ein einziges Mal angezeigt — sofort kopieren, sonst brauchst
    du einen neuen Key. Das Kontopasswort geht ebenfalls, macht bei Sonderzeichen aber oft Ärger.

    '
