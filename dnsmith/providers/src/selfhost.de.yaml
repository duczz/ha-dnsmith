# Quelle fuer providers/selfhost.de.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: selfHOST
description: Deutscher DDNS-Dienst. Je Hostname wird ein eigener Account mit eigenen Zugangsdaten angelegt.
website: https://www.selfhost.de
categories:
- german
- commercial_ddns
- dyndns2_compatible
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
request:
  url: https://carol.selfhost.de/nic/update
  auth:
    mode: basic
    username: '{username}'
    password: '{password}'
  params:
    hostname: '{hostname}'
    myip: '{ip}'
  success:
    vocabulary: dyndns2
fields:
- id: username
  type: text
  label: DynDNS-Benutzername
  required: true
  help: 'Gehört zum jeweiligen DynDNS-Account, nicht zur Webseiten-Anmeldung. Im Kundenmenü unter "DynDNS-Accounts"
    → "Details" zu finden.

    '
- id: password
  type: secret
  label: DynDNS-Kennwort
  required: true
  help: 'Steht ebenfalls unter "DynDNS-Accounts" → "Details" und lässt sich dort neu setzen.

    '
