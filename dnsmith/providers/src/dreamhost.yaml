# Quelle fuer providers/dreamhost.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: DreamHost
description: US-Hoster. DNS-Einträge werden über die Panel-API geändert.
website: https://www.dreamhost.com
categories:
- dns_provider
engine:
  adapter: python
  module: dreamhost
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
rate_limit:
  note: DreamHost drosselt einzelne API-Befehle je Nutzer, nennt aber keine konkreten Zahlen.
fields:
- id: key
  type: secret
  label: API-Key
  required: true
  help: 'Nicht dein Panel-Passwort. Im DreamHost-Panel auf der API-Seite mit "Generate a new API Key"
    erzeugen. Der Key braucht die DNS-Funktionen dns-list_records, dns-add_record und dns-remove_record.

    '
