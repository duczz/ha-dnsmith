# Quelle fuer providers/ionos.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: IONOS
description: Großer deutscher Hoster. Der Schlüssel besteht aus zwei Teilen, durch einen Punkt verbunden.
website: https://www.ionos.com
categories:
- german
- dns_provider
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
lookup:
- url: https://api.hosting.ionos.com/dns/v1/zones
  select:
    where:
      name: '{domain}'
    take: id
  into: zone_id
- url: https://api.hosting.ionos.com/dns/v1/zones/{zone_id}
  params:
    recordName: '{hostname}'
    recordType: '{rrtype}'
  select:
    path: records
    where:
      name: '{hostname}'
      type: '{rrtype}'
    take: id
  into: record_id
  on_missing: create
request:
  url: https://api.hosting.ionos.com/dns/v1/zones/{zone_id}/records/{record_id}
  method: PUT
  auth:
    mode: header
    header: X-API-Key
    format: '{api_key}'
  headers:
    Content-Type: application/json
    Accept: application/json
  body_type: json
  body:
    content: '{ip}'
    disabled: false
  success:
    status:
    - 200
create:
  url: https://api.hosting.ionos.com/dns/v1/zones/{zone_id}/records
  method: POST
  auth:
    mode: header
    header: X-API-Key
    format: '{api_key}'
  headers:
    Content-Type: application/json
    Accept: application/json
  body_type: json
  body:
  - name: '{hostname}'
    type: '{rrtype}'
    content: '{ip}'
    disabled: false
  success:
    status:
    - 201
    - 200
fields:
- id: api_key
  type: secret
  label: API-Key (Prefix.Secret)
  required: true
  help: 'Kein Passwort, sondern ein Schlüssel aus zwei Teilen. Im IONOS Developer Portal unter "Create
    New Key" erzeugen und Prefix und Secret durch einen Punkt getrennt eintragen.

    '
