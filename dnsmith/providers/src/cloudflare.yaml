# Quelle fuer providers/cloudflare.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Cloudflare
description: DNS-Records direkt über die Cloudflare-API aktualisieren, mit Proxy- und TTL-Steuerung.
website: https://www.cloudflare.com
categories:
- cloud_dns
- dns_provider
popular: true
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: true
  proxy: true
  wildcard: true
rate_limit:
  note: 1200 Anfragen pro fünf Minuten und Account.
  min_interval: 60s
auth:
  one_of:
  - id: api_token
    label: API-Token
    recommended: true
    fields:
    - token
    hint: 'Die sichere Variante. Lege unter "My Profile → API Tokens" ein Token mit der Berechtigung Zone
      → DNS → Edit an und beschränke es auf genau diese Zone. Damit kann DNSmith nichts anderes in deinem
      Account tun.

      '
  - id: global_key
    label: E-Mail und Global API Key
    deprecated: true
    fields:
    - email
    - key
    hint: 'Nicht empfohlen. Der Global API Key hat Vollzugriff auf den gesamten Cloudflare-Account, inklusive
      Abrechnung und Domain-Transfers.

      '
lookup:
- url: https://api.cloudflare.com/client/v4/zones/{zone_identifier}/dns_records
  params:
    type: '{rrtype}'
    name: '{hostname}'
    page: '1'
    per_page: '1'
  select:
    path: result
    take: id
  into: record_id
  on_missing: create
request:
  url: https://api.cloudflare.com/client/v4/zones/{zone_identifier}/dns_records/{record_id}
  method: PUT
  auth: &id001
  - mode: bearer
    format: '{token}'
  - mode: headers
    values:
      X-Auth-Email: '{email}'
      X-Auth-Key: '{key}'
  headers: &id002
    Content-Type: application/json
    Accept: application/json
  body_type: json
  body: &id003
    type: '{rrtype}'
    name: '{hostname}'
    content: '{ip}'
    proxied: '{proxied}'
    ttl: '{ttl}'
  success: &id004
    json_path_equals:
      success: true
create:
  url: https://api.cloudflare.com/client/v4/zones/{zone_identifier}/dns_records
  method: POST
  auth: *id001
  headers: *id002
  body_type: json
  body: *id003
  success: *id004
fields:
- id: zone_identifier
  type: text
  label: Zone-ID
  required: true
  help: 'Auf der Übersichtsseite der Domain rechts unten als "Zone ID". Eine 32-stellige Hex-Zeichenkette.

    '
  placeholder: 023e105f4ecef8ad9ca31a8372d0c353
  validate:
    pattern: ^[0-9a-f]{32}$
  ui:
    monospace: true
- id: token
  type: secret
  label: API-Token
- id: email
  type: email
  label: Account-E-Mail
  placeholder: du@example.com
- id: key
  type: secret
  label: Global API Key
- id: proxied
  type: boolean
  label: Cloudflare-Proxy aktiv
  default: false
  help: 'Leitet den Verkehr über Cloudflare. Verbirgt die eigene IP-Adresse, macht den Record aber für
    alles außer HTTP und HTTPS unbrauchbar — also nicht für VPN, SSH oder Mailserver geeignet.

    '
- id: ttl
  type: integer
  label: TTL
  default: 1
  help: Sekunden. Der Wert 1 bedeutet bei Cloudflare "automatisch".
  validate:
    min: 1
    max: 86400
  ui:
    special_values:
      '1': Automatisch
example:
  ttl: '600'
