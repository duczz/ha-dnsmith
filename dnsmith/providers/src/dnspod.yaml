# Quelle fuer providers/dnspod.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: DNSPod
description: Chinesischer DNS-Anbieter. Der Token besteht aus ID und Schlüssel, durch Komma getrennt.
website: https://www.dnspod.cn
categories:
- dns_provider
engine:
  adapter: python
  module: dnspod
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
fields:
- id: token
  type: secret
  label: API-Token
  required: true
  help: 'Achte auf das Format: ID und Token zusammen, durch ein Komma getrennt, etwa 730060,e1a8a…553d.
    Im DNSPod-Konto als API-Token erzeugen. Es ist nicht das Konto-Passwort.

    '
