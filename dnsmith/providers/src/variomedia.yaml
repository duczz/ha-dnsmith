# Quelle fuer providers/variomedia.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Variomedia
description: Deutscher Hoster mit einem eigenen Passwort für die DNS-Einstellungen.
website: https://www.variomedia.de
categories:
- german
- dns_provider
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
request:
  url: https://dyndns{ipversion}.variomedia.de/nic/update
  auth:
    mode: basic
    username: '{email}'
    password: '{password}'
  params:
    hostname: '{hostname}'
    myip: '{ip}'
  success:
    vocabulary: dyndns2
fields:
- id: email
  type: email
  label: E-Mail-Adresse des Kundenaccounts
  required: true
  help: Dieselbe Adresse, mit der du dich bei Variomedia anmeldest.
- id: password
  type: secret
  label: Passwort der DNS-Einstellungen
  required: true
  help: 'Ausdrücklich nicht das Passwort deines Kundenaccounts, sondern ein eigenes Passwort für die DNS-Einstellungen.
    Es wird im Kundenmenü bei den DNS-Einstellungen gesetzt.

    '
example:
  email: email@domain.com
