# Quelle fuer providers/vultr.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Vultr
description: Cloud-Anbieter. Der API-Zugriff ist zusätzlich auf freigegebene IP-Adressen beschränkt.
website: https://www.vultr.com
categories:
- cloud_dns
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: true
  proxy: false
rate_limit:
  note: Ab etwa 30 Anfragen je Sekunde antwortet Vultr mit HTTP 429.
lookup:
- url: https://api.vultr.com/v2/domains/{domain}/records
  params:
    per_page: '500'
  select:
    path: records
    where:
      name: '{subdomain}'
      type: '{rrtype}'
    take: id
  into: record_id
  on_missing: create
request:
  url: https://api.vultr.com/v2/domains/{domain}/records/{record_id}
  method: PATCH
  auth: &id001
    mode: bearer
    format: '{apikey}'
  headers: &id002
    Content-Type: application/json
    Accept: application/json
  body_type: json
  body:
    data: '{ip}'
    name: '{subdomain}'
    ttl: '{ttl}'
  success:
    status:
    - 204
    - 200
create:
  url: https://api.vultr.com/v2/domains/{domain}/records
  method: POST
  auth: *id001
  headers: *id002
  body_type: json
  body:
    type: '{rrtype}'
    data: '{ip}'
    name: '{subdomain}'
    ttl: '{ttl}'
  success:
    status:
    - 201
    - 200
fields:
- id: apikey
  type: secret
  label: API-Key
  required: true
  help: 'Aus dem Kundenportal unter Account → API, nicht das Konto-Passwort. Wichtig: Vultr filtert nach
    IP — trage dort die öffentliche Adresse deines Anschlusses ein, sonst werden alle Anfragen abgelehnt.

    '
- id: ttl
  type: integer
  label: TTL
  help: Sekunden. Leer lassen verwendet den Standardwert der Zone.
example:
  ttl: '300'
