# Quelle fuer providers/namesilo.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: NameSilo
description: US-Registrar. Der API-Schlüssel darf nicht auf Nur-Lesen stehen.
website: https://www.namesilo.com
categories:
- registrar
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: true
  proxy: false
lookup:
- url: https://www.namesilo.com/api/dnsListRecords
  params:
    version: '1'
    type: json
    key: '{key}'
    domain: '{domain}'
  select:
    path: reply.resource_record
    where:
      host: '{hostname}'
      type: '{rrtype}'
    take: record_id
  into: record_id
  on_missing: create
request:
  url: https://www.namesilo.com/api/dnsUpdateRecord
  params:
    version: '1'
    type: json
    key: '{key}'
    domain: '{domain}'
    rrid: '{record_id}'
    rrhost: '{subdomain}'
    rrvalue: '{ip}'
    rrttl: '{ttl}'
  success: &id001
    json_path_equals:
      reply.code: '300'
create:
  url: https://www.namesilo.com/api/dnsAddRecord
  params:
    version: '1'
    type: json
    key: '{key}'
    domain: '{domain}'
    rrtype: '{rrtype}'
    rrhost: '{subdomain}'
    rrvalue: '{ip}'
    rrttl: '{ttl}'
  success: *id001
fields:
- id: key
  type: secret
  label: API-Key
  required: true
  help: 'Im NameSilo API Manager erzeugen, kein Konto-Passwort. Das Häkchen für Nur-Lese-Zugriff darf
    dabei nicht gesetzt sein, sonst schlagen alle Änderungen fehl.

    '
- id: ttl
  type: integer
  label: TTL
  validate:
    min: 3600
    max: 2592001
  help: 'Sekunden, mindestens 3600. Andere Werte lehnt die Engine ab. Leer lassen überlässt NameSilo den
    Standard.

    '
example:
  ttl: '7207'
