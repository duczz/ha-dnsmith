# Quelle fuer providers/hetznercloud.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Hetzner Cloud
description: Dieselbe Firma wie Hetzner, aber die Cloud-API mit eigenen Token.
website: https://www.hetzner.com
categories:
- german
- cloud_dns
engine:
  adapter: python
  module: hetzner
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: true
  proxy: false
fields:
- id: token
  type: secret
  label: API-Token
  required: true
  help: 'Token der Hetzner CLOUD API, nicht der DNS Console auf dns.hetzner.com. In der Cloud Console
    unter Security → API tokens mit "Read & Write" erzeugen; wird nur einmal angezeigt.

    '
- id: ttl
  type: integer
  label: TTL
  placeholder: '600'
  validate:
    min: 60
  help: Sekunden, ab 60. Nur relevant, wenn der Eintrag neu angelegt wird.
notes:
- Seit Hetzner die getrennte DNS-Konsole abgeschaltet hat (27.05.2026), ist das dieselbe Schnittstelle
  wie bei „Hetzner“. Beide Einträge führen zum selben Ergebnis; welchen du nimmst, ist Geschmackssache.
