# Quelle fuer providers/duckdns.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: DuckDNS
description: Kostenloser DDNS-Dienst mit Subdomains unter duckdns.org. Ein Token pro Account, kein Login
  nötig.
website: https://www.duckdns.org
categories:
- free_ddns
- ipv6_focused
popular: true
engine:
  adapter: native
  protocol: http
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
  multiple_records: true
rate_limit:
  note: Keine dokumentierte Grenze. Fünf Minuten sind reichlich.
  min_interval: 60s
request:
  url: https://www.duckdns.org/update
  params:
    verbose: 'true'
    domains: '{hostname}'
    token: '{token}'
    ip: '{ipv4}'
    ipv6: '{ipv6}'
  success:
    body_regex: ^OK
  failures:
    KO: auth
fields:
- id: token
  type: secret
  label: Token
  required: true
  help: 'Steht nach dem Login auf duckdns.org ganz oben als "token". Es gilt für den gesamten Account,
    nicht nur für diese Domain.

    '
  placeholder: 00000000-0000-0000-0000-000000000000
notes:
- 'Der Hostname muss auf duckdns.org enden. Für die Subdomain "zuhause" lautet er zuhause.duckdns.org.

  '
- 'Mehrere Hostnamen derselben Domain lassen sich mit Komma trennen. Zwei verschiedene DuckDNS-Domains
  brauchen dagegen zwei Einträge.

  '
