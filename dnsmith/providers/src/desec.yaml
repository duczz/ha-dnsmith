# Quelle fuer providers/desec.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: deSEC
description: Kostenloser DNS-Dienst aus Deutschland, gemeinnützig getragen und durchgehend mit DNSSEC.
website: https://desec.io
categories:
- free_ddns
- dns_provider
- ipv6_focused
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
rate_limit:
  note: deSEC begrenzt DynDNS-Updates auf zwei Anfragen je zwei Minuten und Domain.
  min_interval: 60s
request:
  url: https://update.dedyn.io/
  auth:
    mode: basic
    username: '{hostname}'
    password: '{token}'
  params:
    hostname: '{hostname}'
    myipv4: '{ipv4|''preserve''}'
    myipv6: '{ipv6|''preserve''}'
  success:
    body_regex: ^good
  failures:
    notfqdn: not_found
    badrequest: config
fields:
- id: token
  type: secret
  label: API-Token
  required: true
  help: 'Nicht dein deSEC-Konto-Passwort, sondern ein eigenes API-Token. Du bekommst es bei der Registrierung
    oder legst es später in der Token-Verwaltung an.

    '
