# Quelle fuer providers/he.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Hurricane Electric
description: Kostenloser DNS-Dienst mit starkem IPv6-Schwerpunkt. Je Eintrag wird ein eigener Schlüssel
  erzeugt.
website: https://dns.he.net
categories:
- free_ddns
- dns_provider
- ipv6_focused
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
request:
  url: https://dyn.dns.he.net/nic/update
  auth:
    mode: basic
    username: '{hostname}'
    password: '{password}'
  params:
    hostname: '{hostname}'
    myip: '{ip}'
  success:
    vocabulary: dyndns2
fields:
- id: password
  type: secret
  label: DDNS-Schlüssel
  required: true
  help: 'Nicht dein dns.he.net-Passwort. Am A- oder AAAA-Eintrag die Option "enable entry for dynamic
    dns" setzen und den Schlüssel danach über das Generate-Symbol erzeugen. Er gilt je Hostname.

    '
