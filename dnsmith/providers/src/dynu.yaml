# Quelle fuer providers/dynu.yaml - von Hand gepflegt.
# Nach jeder Aenderung: python3 tools/manifest_merge.py
name: Dynu
description: Kommerzieller DDNS-Anbieter mit kostenlosem Tarif, eigenen Domains und DynDNS2-kompatibler
  Schnittstelle.
website: https://www.dynu.com
categories:
- commercial_ddns
- free_ddns
- dyndns2_compatible
popular: true
engine:
  adapter: native
  protocol: dyndns2
capabilities:
  ipv4: true
  ipv6: true
  ipv6_suffix: true
  ttl: false
  proxy: false
request:
  url: https://api.dynu.com/nic/update
  params:
    username: '{username}'
    password: '{password}'
    group: '{group}'
    hostname: '{hostname}'
    myip: '{ipv4}'
    myipv6: '{ipv6}'
  success:
    vocabulary: dyndns2
fields:
- id: username
  type: text
  label: Benutzername
  required: true
  help: Der Benutzername des Dynu-Accounts.
- id: password
  type: secret
  label: Passwort oder IP-Update-Passwort
  required: true
  help: 'Dynu empfiehlt ein eigenes IP-Update-Passwort statt des Account-Passworts. Es steht im Control
    Panel unter "IP Update Password".

    '
- id: group
  type: text
  label: Gruppe
  help: 'Nur nötig, wenn mehrere Hostnamen in einer Dynu-Gruppe gemeinsam aktualisiert werden sollen.
    Sonst leer lassen.

    '
notes:
- 'Wichtig bei Dynu: Die Hauptdomain (z. B. beispiel.ddnsgeek.com) wird über den DDNS-Dienst aktualisiert.
  Falls auf dynu.com unter "Control Panel" → "DDNS Services" → [Domain anklicken] im unteren Abschnitt
  "DNS Records" manuelle A- oder AAAA-Einträge für die Domain existieren (erkennbar am Button "Remove DNS Record"),
  überschreiben diese die dynamische IP. Diese manuellen Records müssen dort einmalig per "Remove DNS Record"
  gelöscht werden, damit Dynu die dynamische IP für die Domain übernimmt.'
