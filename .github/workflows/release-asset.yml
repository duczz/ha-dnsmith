name: Release-Asset

# Haengt beim Veroeffentlichen eines Releases ein ZIP von dnsmith/ als Asset
# an. GitHub zaehlt Downloads nur fuer explizit hochgeladene Assets, nicht
# fuer die automatischen "Source code"-Links.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Der Tag liegt auf dem Release-Commit von "Release vorbereiten": Version
      # und datierter CHANGELOG stehen schon in den Dateien, das ZIP bekommt sie
      # also so, wie sie im Tag stehen. Auf main bringt sie Release-Docker,
      # sobald die Images liegen. Geschrieben wird hier nichts. --allow-same: ein
      # "Re-run failed jobs" nach dem Abschluss von Release-Docker findet main
      # schon auf der Version; ein Image überschreibt dieser Job nie.
      - name: Tag muss ein Release-Commit sein
        run: |
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:dnsmith/config.yaml > "${RUNNER_TEMP}/main-config.yaml"
          python3 tools/set_version.py "${GITHUB_REF_NAME}" --verify --against "${RUNNER_TEMP}/main-config.yaml" --allow-same

      - name: ZIP aus dnsmith/ bauen
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -r "ha-dnsmith-${version}.zip" dnsmith
          echo "ASSET=ha-dnsmith-${version}.zip" >> "$GITHUB_ENV"

      - name: Asset an Release haengen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
