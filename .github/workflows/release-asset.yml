name: Release-Asset

# Haengt beim Veroeffentlichen eines Releases ein ZIP von dnsmith/ als Asset
# an. GitHub zaehlt Downloads nur fuer explizit hochgeladene Assets, nicht
# fuer die automatischen "Source code"-Links.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version in config.yaml muss zum Tag passen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cfg="$(grep -m1 '^version:' dnsmith/config.yaml | awk '{gsub(/["[:space:]]/, "", $2); print $2}')"
          if [ "$cfg" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu version \"${cfg}\" in dnsmith/config.yaml. Erst Version anheben und auf main pushen, dann das Release neu anlegen."
            exit 1
          fi

      - name: ZIP aus dnsmith/ bauen
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -r "ha-dnsmith-${version}.zip" dnsmith
          echo "ASSET=ha-dnsmith-${version}.zip" >> "$GITHUB_ENV"

      - name: Asset an Release haengen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
